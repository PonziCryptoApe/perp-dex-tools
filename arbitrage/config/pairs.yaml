    # 账户级风控（后台轮询，不阻塞信号热路径）
    risk_control:
      enabled: false
      dynamic_position_cap_enabled: true
      poll_interval_seconds: 5.0 # 每隔多少秒检查一次账户风险
      stale_after_seconds: 3.0 # 订单簿数据过时阈值（秒）
      fail_safe_block_open: true # 是否启用开仓失败保护（如果订单簿过时则阻止开仓）
      # WARN 仅告警，不强制减仓；最大仓位按弱腿离清算价距离连续联动
      # 语义：
      # - 弱腿离清算价距离 >= 48%：恢复为 NORMAL，允许使用基础最大仓位
      # - 弱腿离清算价距离 <= 45%：进入 WARN（仅告警）
      # - WARN 进入后，只有恢复到 >= 48% 才退出 WARN，避免边界抖动
      # - 30% ~ 40%：最大仓位在 50% ~ 80% 之间线性变化
      # - 40% ~ 48%：最大仓位在 80% ~ 100% 之间线性恢复
      # - 弱腿离清算价距离 <= 40%：进入 REDUCE，若当前仓位超过动态上限则立即减仓
      # - 弱腿离清算价距离 <= 30%：进入 STOP，最大仓位固定为基础上限的 50%
      reduce_position_ratio: 0.76
      stop_position_ratio: 0.65
      reduce_cooldown_seconds: 5.0
      liq_distance_warn: 0.3  # 离清算价距离小于等于 45% 时进入 WARN（仅告警）
      liq_distance_warn_recover: 0.33 # 离清算价距离恢复到大于等于 48% 时退出 WARN
      liq_distance_reduce: 0.26 # 离清算价距离小于等于 40% 时进入 REDUCE（最大仓位降到 80%）
      liq_distance_stop: 0.22   # 离清算价距离小于等于 30% 时进入 STOP（最大仓位降到 50%）

